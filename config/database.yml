default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("LANGFLASH_DATABASE_USERNAME", ENV["USER"]) %>
  password: <%= ENV["LANGFLASH_DATABASE_PASSWORD"] %>
  host: <%= ENV.fetch("LANGFLASH_DATABASE_HOST", "localhost") %>

development:
  <<: *default
  database: langflash_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: langflash_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate
